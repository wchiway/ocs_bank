name: Go checks
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Format
        run: test -z "$(gofmt -l .)"
      - run: go vet ./...
      - run: go test ./...
      - run: go test -race ./...
      - run: go build ./...
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --test tests/ocs.test.mjs
      - run: CGO_ENABLED=0 go build -o /tmp/ocs-bank ./cmd/server
      - run: docker build -t ocs-bank:ci .
      - run: docker run --rm ocs-bank:ci -h
