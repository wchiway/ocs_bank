name: Release
on:
  push:
    tags:
      - 'v[0-9]*.[0-9]*.[0-9]*'
      - '!v*-*'
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag to publish or retry
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: publish-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref_name }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: ./.github/actions/publish-release
        with:
          channel: release
          tag: ${{ inputs.tag || github.ref_name }}
          github-token: ${{ github.token }}
          deepseek-api-key: ${{ secrets.DEEPSEEK_API_KEY }}
          deepseek-model: ${{ vars.DEEPSEEK_MODEL || 'deepseek-v4-flash' }}
