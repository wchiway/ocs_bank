name: Publish versioned release
description: Validate, publish source release, then summarize with DeepSeek Responses
inputs:
  channel:
    description: release or prerelease
    required: true
  tag:
    description: Existing semantic version tag
    required: true
  github-token:
    description: Token with contents write permission
    required: true
  deepseek-api-key:
    description: DeepSeek secret, used only after publishing the release
    required: false
  deepseek-model:
    description: Model supporting the Responses API
    default: deepseek-v4-flash
runs:
  using: composite
  steps:
    - name: Validate tag and main ancestry
      shell: bash
      env:
        RELEASE_TAG: ${{ inputs.tag }}
        RELEASE_CHANNEL: ${{ inputs.channel }}
      run: node .github/scripts/release.mjs prepare
    - name: Test release automation
      shell: bash
      run: node --test tests/release.test.mjs
    - name: Create source release
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token }}
      run: node .github/scripts/release.mjs publish
    - name: Summarize published release using DeepSeek Responses
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token }}
        DEEPSEEK_API_KEY: ${{ inputs.deepseek-api-key }}
        DEEPSEEK_MODEL: ${{ inputs.deepseek-model }}
      run: node .github/scripts/release.mjs summarize
