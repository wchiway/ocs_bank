name: Publish GHCR package
description: Build and push the release's multi-platform container image
inputs:
  tag:
    description: Release version tag
    required: true
  channel:
    description: release or prerelease
    required: true
  github-token:
    description: Token with packages write permission
    required: true
outputs:
  image:
    description: Versioned image reference
    value: ${{ steps.metadata.outputs.image }}
  digest:
    description: Multi-platform manifest digest
    value: ${{ steps.push.outputs.digest }}
runs:
  using: composite
  steps:
    - name: Validate version and main ancestry
      shell: bash
      env:
        RELEASE_TAG: ${{ inputs.tag }}
        RELEASE_CHANNEL: ${{ inputs.channel }}
      run: node .github/scripts/release.mjs prepare
    - name: Compute image metadata
      id: metadata
      shell: bash
      run: node .github/scripts/package-metadata.mjs
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v4
    - name: Log in to GitHub Container Registry
      uses: docker/login-action@v4
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ inputs.github-token }}
    - name: Build and push package
      id: push
      uses: docker/build-push-action@v7
      with:
        context: .
        file: ./Dockerfile
        platforms: linux/amd64,linux/arm64
        push: true
        tags: ${{ steps.metadata.outputs.tags }}
        labels: |
          org.opencontainers.image.source=https://github.com/${{ github.repository }}
          org.opencontainers.image.version=${{ inputs.tag }}
          org.opencontainers.image.revision=${{ steps.metadata.outputs.commit }}
        cache-from: type=gha,scope=release-package
        cache-to: type=gha,mode=max,scope=release-package
